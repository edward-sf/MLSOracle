[project]
name = "mlsoracle"
version = "0.1.0"
description = "Personal DS/ML project analyzing performance, compensation, and outcomes in Major League Soccer."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "geopandas>=1.1.4",
    "kloppy>=3.19.0",
    "mplsoccer>=1.8.0",
    "optuna>=5.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "soccerdata>=1.9.1",
    "tabula-py>=2.10.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "N",   # pep8-naming
]

[tool.ruff.lint.isort]
known-first-party = ["mlsoracle"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
